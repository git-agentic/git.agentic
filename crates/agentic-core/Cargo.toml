[package]
name = "agentic-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Content-addressed object store and snapshot engine for git.agentic"

[dependencies]
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
zstd.workspace = true
thiserror.workspace = true
anyhow.workspace = true
hex.workspace = true
chrono.workspace = true
tracing.workspace = true
tokio.workspace = true
# reqwest's blocking client is the sync wrapper the ObjectStore trait
# needs. The workspace declaration sets `default-features = false` plus
# `rustls-tls + json`; we restate them here so HTTPS to GCS keeps working
# even if a future change to the workspace stanza drops them — Cargo
# unions duplicate features, so this is purely defensive/self-documenting.
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.10"
criterion.workspace = true

[[bench]]
name = "store"
harness = false
