version: "3.9"

# Standalone Postgres + pgvector for the broken-prompt demo.
# Works with podman compose (rootless) or docker compose.
#
#   podman compose up -d
#   podman compose down -v   # tears down + wipes the volume on exit
#
# run-demo.sh uses this file automatically; you should not need to
# bring it up manually unless you are driving the walkthrough by hand.

services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: agentic-demo-pg
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports:
      - "54322:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 2s
      timeout: 5s
      retries: 30
