version: "3.9"

# Local Postgres + pgvector for `cargo test -p agentic-memory --test
# integration -- --ignored`. Bring up with podman (rootless-friendly):
#
#   podman compose -f tests/fixtures/pg.yml up -d
#   DATABASE_URL=postgres://agentic:agentic@localhost:54321/agentic \
#     cargo test -p agentic-memory --test integration -- --ignored
#   podman compose -f tests/fixtures/pg.yml down -v
#
# `wal_level=logical` is required for the replication slot path. The
# compose file is also docker-compose-compatible if you prefer Docker.

services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: agentic-test-pg
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports:
      - "54321:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 2s
      timeout: 5s
      retries: 30
