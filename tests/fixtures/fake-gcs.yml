version: "3.9"

# Local fake-gcs-server for testing GcsObjectStore without real GCP
# credentials.
#
#   podman compose -f tests/fixtures/fake-gcs.yml up -d
#   GCS_ENDPOINT=http://localhost:54323 GCS_BUCKET=agentic-test-bucket \
#     cargo test -p agentic-core --test gcs_integration -- --ignored
#   podman compose -f tests/fixtures/fake-gcs.yml down -v
#
# fake-gcs-server speaks the GCS JSON API. The bucket referenced by
# GCS_BUCKET is auto-created the first time we upload to it.

services:
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: agentic-test-fake-gcs
    command:
      - "-scheme"
      - "http"
      - "-public-host"
      - "localhost:54323"
      - "-port"
      - "4443"
    ports:
      - "54323:4443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4443/storage/v1/b || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
