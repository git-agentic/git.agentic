# Fake GCS server fixture for `agentic-core::gcs_store` integration tests.
#
# Usage:
#   podman compose -f tests/fixtures/fake-gcs.yml up -d
#   curl -fsSL -X POST -H 'Content-Type: application/json' \
#     -d '{"name":"agentic-test-bucket"}' \
#     http://localhost:54323/storage/v1/b
#   GCS_ENDPOINT=http://localhost:54323 GCS_BUCKET=agentic-test-bucket \
#     cargo test -p agentic-core --test gcs_integration -- --ignored
#   podman compose -f tests/fixtures/fake-gcs.yml down -v
#
# fsouza/fake-gcs-server speaks the GCS JSON API. The bucket referenced
# by GCS_BUCKET must exist before the tests run; create it via the
# `POST /storage/v1/b` call shown above. Image tag is pinned for
# reproducibility.

services:
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.2
    container_name: agentic-test-fake-gcs
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-public-host"
      - "localhost:54323"
      - "-backend"
      - "memory"
    ports:
      - "54323:4443"
