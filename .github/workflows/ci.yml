name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: doc
        run: cargo doc --workspace --no-deps

  python:
    name: python sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e "sdk/python[langgraph,dev]"
      - name: ruff
        run: ruff check sdk/python
      - name: mypy
        run: mypy --strict --config-file sdk/python/pyproject.toml sdk/python/agentic
      - name: pytest
        run: pytest sdk/python/tests -q

  # GCS integration tests against fsouza/fake-gcs-server. Closes the
  # ADR-0003 / ADR-0004 end-of-week-8 kill-criterion: GcsObjectStore must
  # pass integration tests, else revert Executor atomic integration to
  # the layered manifest-export shape and defer to v1.1.
  gcs:
    name: gcs integration (fake-gcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: start fake-gcs
        run: |
          docker run -d --name fake-gcs -p 54323:4443 \
            fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -public-host localhost:54323 -backend memory
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:54323/storage/v1/b >/dev/null 2>&1; then
              echo "fake-gcs ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: create bucket
        run: |
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            -d '{"name":"agentic-test-bucket"}' \
            http://localhost:54323/storage/v1/b
      - name: run gcs integration tests
        env:
          GCS_ENDPOINT: http://localhost:54323
          GCS_BUCKET: agentic-test-bucket
        run: cargo test -p agentic-core --test gcs_integration -- --ignored --nocapture
