[workspace]
resolver = "2"
members = [
    "crates/agentic-core",
    "crates/agentic-memory",
    "crates/agentic-proto",
    "crates/agentic-cli",
    "crates/agenticd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["git.agentic contributors"]
license = "Apache-2.0"
repository = "https://github.com/git-agentic/git.agentic"

[workspace.dependencies]
# Core async + IO
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"

# Hashing + serialization
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
prost-build = "0.12"

# Storage + DB
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
pgvector = { version = "0.4", features = ["sqlx"] }
zstd = "0.13"

# CLI + logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Misc
uuid = { version = "1.8", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
once_cell = "1.19"
async-trait = "0.1"

# Workspace-internal
agentic-core = { path = "crates/agentic-core" }
agentic-memory = { path = "crates/agentic-memory" }
agentic-proto = { path = "crates/agentic-proto" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
