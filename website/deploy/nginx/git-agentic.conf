# /etc/nginx/sites-available/git-agentic
#
# git-agentic.com → canonical, serves the static site
# git-agentic.dev → 301 to https://git-agentic.com
# git-agentic.org → 301 to https://git-agentic.com
#
# After certbot --nginx, the listen 443 / ssl_certificate / ssl_certificate_key
# blocks will be injected automatically. Keep the port-80 blocks above so the
# ACME http-01 challenge can be served from /var/www/certbot.

# ---- canonical ------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name git-agentic.com www.git-agentic.com;

    # ACME challenge passthrough (mirrors tom-cruises.com convention)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to https once certs land.
    # Until then nginx -t still passes and http://git-agentic.com serves the site.
    location / {
        root /var/www/git-agentic.com;
        try_files $uri $uri/ $uri.html =404;
        index index.html;
    }
}

# ---- redirects ------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name git-agentic.dev www.git-agentic.dev
                git-agentic.org www.git-agentic.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://git-agentic.com$request_uri;
    }
}

