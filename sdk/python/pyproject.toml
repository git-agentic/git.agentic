[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-sdk"
version = "0.1.0"
description = "Git for agent behavior — the Python SDK for git.agentic"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "git.agentic contributors" }]
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",                # used for daemon HTTP transport in v1.1
    "anyio>=4.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["agentic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
